name: Build ExtremeGram
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env@sha256:29657d0ab22dde4f5fe7dff5f294828908a18548ab3f11c362c63b4d49d7dcc1
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check configuration
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo 'Missing repository secrets TDESKTOP_API_ID or TDESKTOP_API_HASH.' >&2
            exit 1
          fi
      - name: Pull build environment
        run: docker pull "$IMAGE"
      - name: Prepare ccache
        run: mkdir -p .ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: Compile
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" -v "$PWD/.ccache:/ccache" \
            -e CONFIG=Release -e KEEP_GOING=1 \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=3G -e CCACHE_COMPRESS=true \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e API_ID -e API_HASH "$IMAGE" \
            bash -c 'exec /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_USE_PANGO=OFF \
              -D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH"'
      - name: Install application
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" -e DESTDIR=/usr/src/tdesktop \
            -w /usr/src/tdesktop/Telegram "$IMAGE" \
            cmake --install /usr/src/tdesktop/out --config Release --prefix /pkg/usr
      - name: Package AppImage
        run: |
          set -eu
          appdir="$PWD/pkg"
          cp "$appdir/usr/share/applications/rua.Yurigram.desktop" "$appdir/rua.Yurigram.desktop"
          sed -i -e 's/^Name=Yurigram$/Name=ExtremeGram/' -e 's/^DBusActivatable=true$/DBusActivatable=false/' "$appdir/rua.Yurigram.desktop"
          cp "$appdir/usr/share/icons/hicolor/256x256/apps/rua.Yurigram.png" "$appdir/rua.Yurigram.png"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/yurigram" "$@"' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            --mksquashfs-opt -b --mksquashfs-opt 1M "$appdir" ExtremeGram-x86_64.AppImage
          sha256sum ExtremeGram-x86_64.AppImage > ExtremeGram-x86_64.AppImage.sha256
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ExtremeGram-x86_64
          path: |
            ExtremeGram-x86_64.AppImage
            ExtremeGram-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish AppImage release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="build-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "ExtremeGram build ${GITHUB_RUN_ID}" \
            --notes "Automated AppImage build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}." \
            || true
          gh release upload "$tag" \
            ExtremeGram-x86_64.AppImage \
            ExtremeGram-x86_64.AppImage.sha256 \
            --clobber

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      # Checkout one level deeper: prepare.py places Libraries/, ThirdParty/
      # and cache_keys/ next to the checkout, so nesting the repo under
      # TBuild/ keeps all build inputs inside the workspace and cacheable.
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild/ExtremeGram
      - name: Check configuration
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: bash
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo 'Missing repository secrets TDESKTOP_API_ID or TDESKTOP_API_HASH.' >&2
            exit 1
          fi
      - name: Compute prepare hash
        id: keys
        shell: bash
        run: |
          HASH=$(sha256sum "$GITHUB_WORKSPACE/TBuild/ExtremeGram/Telegram/build/prepare/prepare.py" | awk '{ print $1 }')
          CPPTDIR=$(find "/c/Program Files (x86)/Windows Kits/10/Include" -maxdepth 2 -type d -name cppwinrt 2>/dev/null | sort -V | tail -1)
          WINRT=$(find "$CPPTDIR" -type f -name '*.h' -exec sha256sum {} + 2>/dev/null | LC_ALL=C sort | sha256sum | awk '{ print $1 }')
          HASH=$(printf '%s-%s' "$HASH" "$WINRT" | sha256sum | awk '{ print $1 }')
          echo "third=win-thirdparty-${HASH}" >> "$GITHUB_OUTPUT"
          echo "libs=win-libs-${HASH}" >> "$GITHUB_OUTPUT"
          echo "qt=win-qt-${HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore ThirdParty cache
        uses: actions/cache/restore@v4
        with:
          path: TBuild/ThirdParty
          key: ${{ steps.keys.outputs.third }}
          restore-keys: |
            win-thirdparty-
      - name: Restore libraries cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.keys.outputs.libs }}
      - name: Restore Qt cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.keys.outputs.qt }}
      - name: Prepare dependencies
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\TBuild\ExtremeGram\Telegram\build\prepare"
          win.bat qt6 skip-debug skip-dump-syms silent
      # Drop intermediates so the caches stay below the 10 GB limit.
      - name: Prune libraries for cache
        shell: bash
        run: |
          LIBS="$GITHUB_WORKSPACE/TBuild/Libraries/win64"
          find "$LIBS" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' \
            -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' \
            -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' \
            -o -path '*/cache_keys/*' -o -path '*/patches/*' \
            -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' \
            -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' \
            ! -path '*/target/*' ')' ')' -type f ')' \
            -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' \
            ')' -delete
      - name: Save ThirdParty cache
        if: steps.third.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TBuild/ThirdParty
          key: ${{ steps.keys.outputs.third }}
      - name: Save libraries cache
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.keys.outputs.libs }}
      - name: Save Qt cache
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.keys.outputs.qt }}
      # NtCreatePagingFile: expands commit limit live, no reboot needed.
      - name: Configure page file
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"
      - name: Configure
        shell: cmd
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\TBuild\ExtremeGram\Telegram"
          configure.bat -G "Ninja Multi-Config" -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\TBuild\ExtremeGram\Telegram"
          cmake --build ../out --config Release --parallel 4
      - name: Package
        shell: pwsh
        run: |
          $out = "TBuild/ExtremeGram/out/Release"
          $exe = Get-ChildItem -Path $out -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path TBuild/ExtremeGram/out -Recurse -Filter *.exe | Select-Object FullName | Out-String
            throw "no .exe found under out/"
          }
          Compress-Archive -Path $exe.FullName -DestinationPath ExtremeGram-win64.zip -Force
          (Get-FileHash ExtremeGram-win64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii ExtremeGram-win64.zip.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ExtremeGram-win64
          path: |
            ExtremeGram-win64.zip
            ExtremeGram-win64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="build-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExtremeGram build ${GITHUB_RUN_ID}" \
            --notes "Automated builds of ${GITHUB_REF_NAME} at ${GITHUB_SHA}." \
            || true
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            ExtremeGram-win64.zip \
            ExtremeGram-win64.zip.sha256 \
            --clobber
